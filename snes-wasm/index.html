<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dash Boots</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0f;
        overflow: hidden;
      }
      #app {
        height: 100%;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
      #status {
        color: #cfe8ff;
        font: 14px/1.5 ui-monospace, monospace;
        text-align: center;
        padding: 1rem;
        max-width: 40rem;
      }
      #status.error {
        color: #ff8a8a;
      }
      #toast {
        position: fixed;
        bottom: 6%;
        left: 50%;
        transform: translateX(-50%);
        color: #cfe8ff;
        background: rgba(11, 11, 15, 0.85);
        border: 1px solid #2a2a38;
        border-radius: 0.4rem;
        font: 14px/1.5 ui-monospace, monospace;
        padding: 0.4rem 0.9rem;
        opacity: 0;
        transition: opacity 0.25s;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="status">Loading…</div>
      <canvas id="game" width="320" height="180" hidden></canvas>
      <div id="toast"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
