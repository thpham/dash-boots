<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dash Boots</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0f;
        overflow: hidden;
      }
      #app {
        height: 100%;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
      #status {
        color: #cfe8ff;
        font: 14px/1.5 ui-monospace, monospace;
        text-align: center;
        padding: 1rem;
        max-width: 40rem;
      }
      #status.error {
        color: #ff8a8a;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="status">Loading…</div>
      <canvas id="game" width="320" height="180" hidden></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
