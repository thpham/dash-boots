<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SNES-like Platformer (WASM)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0f;
      }
      #app {
        height: 100%;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* Avoid browser gestures selecting/scrolling the canvas. */
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="320" height="180"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
