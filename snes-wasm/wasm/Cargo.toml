[package]
name = "snes-wasm"
version = "0.1.0"
edition = "2021"
description = "SNES-inspired platformer simulation compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129" # keep in sync with wasm-bindgen-cli in flake.nix
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
glam = "0.29"
libxm = "1"


[profile.release]
opt-level = "s"
lto = true

# Level generation tests play thousands of bot runs; optimise the test build
# (debug assertions stay on).
[profile.test]
opt-level = 2
